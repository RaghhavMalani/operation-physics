[project]
name = "physcal"
version = "0.1.0"
description = "Calibrated physics reasoning via RLVR"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "peft>=0.21.2",
    "pint>=0.25.3",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "sympy>=1.14.0",
    "torch>=2.14.1",
    "transformers==5.17.0",
    "trl>=1.13.0",
    "unsloth==2026.10.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["physcal"]

[tool.uv]
cache-dir = ".cache/uv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: long-running tests",
    "gpu: tests that need a CUDA GPU",
]

[dependency-groups]
dev = [
    "hypothesis>=6.169.0",
    "pytest>=9.1.1",
]
