# Verifier and reward settings.
scoring:
  rule: crps                # main rule; ablations: binary | log_score | abs_rel_error | crps_log (proper, log space)
  sigma_floor: 1.0e-3       # minimum relative sigma s = max(sigma/|y|, sigma_floor)
  crps_clip: 5.0            # score_final = max(-CRPS, -crps_clip); also used by crps_log
  log_score_clip: 10.0      # score_final = max(-NLL, -log_score_clip)
  abs_rel_error_clip: 5.0   # score_final = max(-|e|, -abs_rel_error_clip)
  binary_tolerance: 0.01    # "correct" = within 1% relative; also the eval accuracy definition

weights:
  final: 1.0
  steps: 0.2                # must satisfy steps < final * (ceiling - floor) of the rule (checked at load)

steps:
  tolerance: 0.02           # step credit if within 2% relative of truth
  empty_score: 0.0          # score_steps when a problem requests no intermediates (depth 1)

checks:
  copy_tolerance: 1.0e-3    # answer within this relative distance of a same-unit given counts as "copied"
