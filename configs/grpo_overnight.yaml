# Phase 3.6 overnight GRPO on the SFT A/B winner (approved brief): crps_log, 4 prompts x 8 completions per step,
# EMA curriculum starting at depths 1-2, hard stop 06:30 IST, checkpoint every 50 steps, keep the last 3.
# The model block, token budget and run id are filled in from the A/B result (results/model_probe_sft/).
run_id: overnight-grpo-qwen2.5-math-1.5b-instruct-sft-crps_log-512
output_dir: results/train
seed: 0
prompt: v4_worked_example
reward_rule: crps_log
train_seed_offset: 0           # GRPO seeds 0.. per cell block (SFT used 1e7..; eval >= 1e9)

model:
  id: results/sft/qwen2.5-math-1.5b-instruct/merged   # SFT A/B winner (results/model_probe_sft/ab_selection.json)
  revision: null
  max_seq_length: 2048         # longest v4 prompt 1156 tokens + up to 768 completion tokens
  chat_template_kwargs: {}
  text_only: false

lora:
  r: 16
  alpha: 16
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

curriculum:
  pool_per_cell: 400           # pre-generated training problems per (family, depth) cell
  alpha: 0.1                   # EMA rate per observed group
  weight_floor: 0.02           # spec: w = p(1-p) + 0.02
  prior_pass_rate: 0.5
  start_depths: [1, 2]
  unlock_pass_rate: 0.5        # open depth d+1 of a family once depth d's EMA pass rate reaches this...
  min_observations: 8          # ...after at least this many groups at depth d

grpo:
  max_steps: 5000              # effectively unbounded; the 06:30 IST hard stop binds
  wall_clock_limit_minutes: 600
  prompts_per_step: 4
  extra_prompts: 0
  num_generations: 8
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8   # 4 x 8 = 32 completions = 4 prompts x 8 per optimizer step
  max_completion_length: 512   # winner truncates 0% at 512
  max_prompt_length: 1280
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  repetition_penalty: 1.0
  beta: 0.0
  learning_rate: 5.0e-6
  lr_scheduler_type: constant_with_warmup
  warmup_steps: 5
  optim: adamw_8bit
  weight_decay: 0.0
  max_grad_norm: 0.1
  save_steps: 50
  save_total_limit: 3          # keep the last three checkpoints

guards:
  max_gpu_temp_c: 87
  pause_seconds: 600
  check_every_steps: 2
