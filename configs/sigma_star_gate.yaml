# Phase 10 step 4: generator self-consistency gate, criterion as amended by D50/A3.
env_config: env_v2
families: [kinematics, dynamics, energy]   # round-robin within each cell
depths: [1, 2, 3, 4, 5]
levels: [0.01, 0.02, 0.05, 0.1]           # noise > 0 cells; noise 0 is checked separately for exactness
n_per_cell: 500                           # 20 cells x 500 = 10,000 problems
noise_zero_n: 500
seed_offset: 1500000000                   # eval-only range, disjoint from the frozen eval splits (1e9 + index*1e6)
cell_seed_stride: 100000                  # each cell gets its own seeds (cells are independent, not paired)
interval_k: [1, 2]                        # intervals ln f(x_meas) +/- k sigma*; nominal = P(|N(0,1)| <= k)
alpha: 0.05                               # Kupiec pooled, per-cell Holm, PIT KS
binomial_interval: 0.99                   # per-cell coverage must sit inside this central binomial interval...
min_share_cells_inside: 0.95              # ...for at least this share of cells (per level k)
pit_bins: 10
n_jobs: 4
output_dir: results/sigma_star_gate
