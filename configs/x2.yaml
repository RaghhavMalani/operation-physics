# X2 (REVIEW_SYNTHESIS_ROUND2_2026-10-17, pre-registered in DECISIONS.md D74): within-problem correctness pairs.
# Does any confidence source rank a correct answer above an incorrect one to the SAME problem (difficulty fixed)?
env_config: env                        # generator 1.1.0 (noise-free: the SFT model's domain and the frozen eval sets)
candidates:                            # frozen pool, training split, round-robin over the 12 training cells
  families: [kinematics, dynamics, energy]
  depths: [1, 2, 3, 4]
  n: 1200                              # 100 per cell. Mixed rate at k = 8 was 21/48 = 44% (bf16 SFT, model_probe_sft):
                                       # ~530 mixed problems expected
  seed_offset: 30000000                # unused elsewhere (GRPO 0..4799, SFT 1e7.., calibration 2e7..2e7+1999,
                                       # fingerprint prompts 4e7.., X1 5e7..5.2e7)
  file: data/eval_sets/1.1.0+c735a0d4/x2_candidates.jsonl
sampling:                              # GPU, a later night: the corrected SFT model (4-bit, no adapter), the training
  k: 8                                 # decoding (T = 1, no truncation), the candidates in their frozen order
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  max_new_tokens: 512
  seed: 0                              # chunk i uses torch seed seed + i (D81)
  batch_size: 16                       # sequences per generate call (2 problems x 8). D81: overridden by the largest
                                       # batch the night's probe finds (scripts/x2_batch_probe.py), recorded in each tape
  chunk_size: 200                      # D81: candidates per chunk (each chunk is its own tape, committed; the chunks
                                       # form a prefix of the frozen order, so a partial night is still stratified)
  max_reserved_gib: 5.75               # D81: allocator cap: past it torch raises OOM, which the eval's backoff handles,
                                       # instead of spilling into WSL shared memory. D86 (launch, 2026-10-19 23:06): 7.5 ->
                                       # 5.75, because a host process holds ~1.65 GB of VRAM tonight (8.0 - 1.65 - 0.5 margin)
  output_dir: results/x2/sft_k8        # chunk_<start>/ per chunk
batch_probe:                           # D81: the largest batch (sequences per call, a multiple of k) that fits
  candidates: [128, 96, 64, 48, 32, 16]
  min_new_tokens: 512                  # every sequence forced to the full budget: the worst case
  output: results/x2/batch_probe.json
suffix:                                # method 2 (D74): split credit's greedy sigma suffix on each kept answer
  run: results/train/split-credit-grpo-qwen2.5-math-1.5b-instruct-sft-crps_log-v1.1.0-512-seed0
  adapter: permanent_checkpoints/checkpoint-287   # the corrected eval's adapter (FINDINGS #16)
  batch_size: 16                       # D87: 32 distinct ~1,300-token prompts per prefill ran out of physical VRAM
                                       # tonight (no cap -> WSL spill, ~60 s / batch); 16, under the sampling cap
  output_dir: results/x2/split_seed0_suffix
hidden:                                # methods 5 / 6 (D74): hidden state at the first token of "±" in <answer>
  fit_tapes:                           # D69's 4-bit SFT greedy calibration completions (seeds 2e7..2e7+1999)
    - results/posthoc_calibration_4bit/sft_calibration_set/rollouts.jsonl
    - results/posthoc_calibration_4bit/sft_calibration_ext/rollouts.jsonl
  model_dir: results/sft/qwen2.5-math-1.5b-instruct/merged   # the corrected SFT model: this dir, 4-bit at load
  random_init_dir: results/x2/random_init_model   # same architecture, random weights (seed 0), loaded the same way
  random_init_seed: 0
  max_seq_length: 2048
  batch_size: 8                        # sequences per forward (every layer's states are returned)
  logit_check_rtol: 0.02               # Unsloth-path check on the first batch: lm_head(last state) (with or without
                                       # the final norm) vs the model's own logits at the position, max |diff| / max
                                       # |logit| (bf16 logits); a larger gap -> transformers + bitsandbytes (D74)
  output_dir: results/x2/hidden
selection:
  tolerance: 0.01                      # correct = |relative error| <= 1% (the verifier's binary tolerance)
  min_correct: 1                       # a problem is kept iff >= 1 correct and >= 1 incorrect parsed answer
  min_incorrect: 1
analysis:
  sigma_floor_rel: 1.0e-6              # stated σ = 0 -> this relative floor (the PREREGISTRATION convention)
  bootstrap: 10000                     # over problems
  seed: 0
  alpha: 0.05                          # Holm over the primary methods (D74)
  a5_config: nested_baselines_4bit     # D69: the A5 re-fitted on 4-bit SFT completions
  problem_only_p: problem/gbt          # method 4: A5's "problem" p model (the lower CV Brier of problem/linear, /gbt)
  probe:                               # methods 5 / 6 and the cross-fitted secondary (D74)
    C: [0.001, 0.01, 0.1, 1.0]         # probe_sft.yaml's logistic grid
    folds: 5                           # grouped by template (fit set) / by problem (cross-fitted)
    max_iter: 2000
    n_jobs: 4
output_dir: results/x2
