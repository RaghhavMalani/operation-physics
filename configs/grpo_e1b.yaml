# E1b: sigma mapped to the nearest of nine relative bins before crps_log (DECISIONS.md D52, pre-registered). GRPO on the sigma suffix only: prompts are SFT-only completions
# truncated after "+-" (configs/e1.yaml), so mu is fixed and the advantage compares sigmas. Hyperparameters as the
# split-credit run (configs/grpo_split_credit.yaml) wherever they apply; no curriculum, no split credit.
run_id: e1b-sigma-only-bins-seed0
output_dir: results/train
seed: 0
prompt: v4_worked_example
reward_rule: crps_log
e1_mode: bins

model:
  id: results/sft/qwen2.5-math-1.5b-instruct/merged
  revision: null
  max_seq_length: 2048         # prompt + prefix <= 1,476 tokens (results/e1/data/data_report.json) + 24
  chat_template_kwargs: {}
  text_only: false

lora:
  r: 16
  alpha: 16
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

grpo:
  max_steps: 300               # 1,200 prefixes (60% of an epoch), D52
  wall_clock_limit_minutes: 240
  num_generations: 8
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 16  # 2 x 16 = 32 completions = 4 prefixes x 8 per optimizer step
  max_completion_length: 24    # the sigma suffix (original suffixes <= 15 tokens incl. end of turn)
  max_prompt_length: 1536      # never truncates: the longest prompt + prefix is 1,476 tokens
  temperature: 1.0
  top_p: 1.0
  top_k: 0
  repetition_penalty: 1.0
  beta: 0.0
  learning_rate: 5.0e-6
  lr_scheduler_type: constant_with_warmup
  warmup_steps: 5
  optim: adamw_8bit
  weight_decay: 0.0
  max_grad_norm: 0.1
  save_steps: 50
  save_total_limit: 2
  permanent_save_steps: [150]  # matched-step fallback if a run stops early (D52)

guards:
  max_gpu_temp_c: 87
  pause_seconds: 600
  check_every_steps: 2
  max_reserved_gib: 7.5
