# D50/A6: counterfactual sensitivity pairs (propagation vs lookup); eval only. Built on generator 2.0.0.
env_config: env_v2
construction:                       # stored in every pair problem (replay uses the stored copy)
  version: "1.0.0"
  candidate_worlds: 24              # worlds drawn per chain; the lowest- and highest-sigma* (delta method) form the pair
  min_ratio: 2.0                    # keep a pair only if sigma*_hi / sigma*_lo (delta method) >= this
  max_chains: 20                    # chains tried per pair seed before giving up (power-law chains never qualify)
export:                             # frozen pair set: data/eval_sets/<generator_version>/a6_pairs.jsonl
  families: [kinematics, dynamics, energy]   # round-robin over pair seeds
  depths: [1, 2, 3, 4, 5]
  levels: [0.01, 0.02, 0.05]        # D54 main-experiment levels
  pairs_per_cell: 34                # 15 cells x 34 = 510 pairs = 1,020 problems
  max_seeds_per_cell: 136           # stop trying a cell after this many pair seeds (failures are reported)
  seed_offset: 1800000000           # pair seeds; disjoint from every gate run and eval split
  cell_seed_stride: 100000
  n_jobs: 4
analysis:                           # primary: OLS slope of d ln(stated sigma) on d ln(sigma*) within pairs (D50/A6)
  tau: 1.0e-3                       # A1 computation-correct: |ln mu - ln f(x_meas)| <= tau
  sigma_floor_rel: 1.0e-6           # stated sigma = 0 -> this relative floor (PREREGISTRATION convention)
  bootstrap: 10000
  seed: 0
  alpha: 0.05
  label_ci_level: 0.90              # D61/D64: the primary slope's label comes from its 90% bootstrap CI

# D59/A6b: invariance pairs (power-law templates: relative sigma* does not depend on the values). Eval only.
invariance_construction:            # stored in every A6b problem (replay uses the stored copy)
  version: "1.0.0"
  kind: invariance
  candidate_worlds: 24              # worlds per chain; smallest / largest clean target value form the pair
  min_target_ratio: 2.0             # keep a pair only if target_hi / target_lo >= this
  max_chains: 20
  power_law_tol: 1.0e-5             # a chain is power-law if its log-sensitivities agree within this...
  power_law_reference_worlds: 6     # ...at this many reference worlds...
  power_law_reference_seed: 0       # ...drawn with this seed
  max_log_sigma_ratio: 1.0e-3       # MC check: |ln(sigma*_hi / sigma*_lo)| must not exceed this
invariance_export:                  # data/eval_sets/<generator_version>/a6b_pairs.jsonl
  families: [kinematics, dynamics, energy]   # round-robin over the families with power-law templates at a depth
  depths: [1, 2, 3, 4, 5]
  levels: [0.01, 0.02, 0.05]
  pairs_per_cell: 34
  max_seeds_per_cell: 136
  seed_offset: 1900000000
  cell_seed_stride: 100000
  n_jobs: 4
invariance_analysis:                # D59: TOST of the slope of d ln(stated sigma) on ln(target_hi / target_lo)
  equivalence_margin: 0.3
  ci_level: 0.90                    # TOST at alpha = 0.05: the 90% CI must lie inside the margin

# D95/A6c (R3-5): noise-allocation pairs. Same chain, world and displayed values; the high level h sits on the given
# where it moves sigma* least (lo) or most (hi), every other given has l. Eval only.
allocation_construction:            # stored in every A6c problem, plus the cell's `levels: [l, h]` (replay uses the copy)
  version: "1.0.0"
  kind: allocation
  candidate_worlds: 24              # world draws per chain: the first valid one (kappa <= max) is used
  min_ratio: 1.5                    # keep a pair only if sigma*_hi / sigma*_lo (delta method) >= this (D95: not 2)
  max_chains: 20
allocation_export:                  # data/eval_sets/<generator_version>/a6c_pairs.jsonl
  families: [kinematics, dynamics, energy]   # round-robin over pair seeds
  depths: [1, 2, 3, 4, 5]
  levels: [[0.01, 0.05], [0.02, 0.05], [0.01, 0.02]]   # (l, h) per cell, from D54's main-experiment levels
  pairs_per_cell: 34                # 15 cells x 34 = 510 pairs = 1,020 problems
  max_seeds_per_cell: 136
  seed_offset: 2000000000           # disjoint from A6 (1.8e9) and A6b (1.9e9)
  cell_seed_stride: 100000
  n_jobs: 2                         # built while the GPU queue runs (heat)

# D95 (R3-4 A): the noise heuristics (max / mean / RSS of the visible levels), scored on the frozen pair sets.
noise_heuristics:
  generator_version: 2.0.0+bdbb2279
  sets: [a6_pairs, a6b_pairs, a6c_pairs]
  output_dir: results/noise_heuristics

# R4-5 (D113): the frozen confirmatory set. The three constructions and cells above, fresh pair-seed offsets, written to
# data/eval_sets/<version>/confirmatory/. Untouched until a 3-seed confirmatory run (run_eval refuses the directory
# unless PHYSCAL_CONFIRMATORY=1).
confirmatory:
  subdir: confirmatory
  seed_offsets: {a6: 2100000000, a6b: 2200000000, a6c: 2300000000}   # disjoint from 1.8e9 / 1.9e9 / 2.0e9 (+1.5e6 each)
  n_jobs: 1                         # built while the GPU queue runs (heat, D97)

# R5-6 part J (D147): Jacobians outside the training range of trained chains (physcal/env/pairs_j.py). Eval only; the
# frozen J set: data/eval_sets/<version>/confirmatory/r5_6/{a6c,a6b}_pairs.jsonl (run_eval needs PHYSCAL_CONFIRMATORY=1).
r5_6:
  subdir: confirmatory/r5_6
  support:                          # physcal.env.jacobian_support build (D147 §1)
    training_problems: results/phase12_sft_data_r4/problems.jsonl   # the R4-1 problems: both arms' training data
    file: data/jacobian_support/r4_1.json
j_jacobian: &j_jacobian             # D147 §2, shared by both J constructions
  support_file: data/jacobian_support/r4_1.json
  support_sha256: eda3c3b216ad66c1afb424f9f61df38c0284f8eaf0f315c16616e253a3a97004   # the support file's SHA-256 (replay refuses another file)
  margin: 0.1                       # one given's d ln f / d ln x outside its chain's training range by >= this
j_allocation_construction:          # D147 §3: A6c's construction on J worlds
  version: "1.0.0"
  kind: j_allocation
  candidate_worlds: 96              # world draws per chain; the first J world is used (A6c: 24)
  min_ratio: 1.5                    # as A6c (D95)
  max_chains: 20
  jacobian: *j_jacobian
j_allocation_export:
  families: [kinematics, dynamics, energy]   # round-robin over pair seeds
  depths: [1, 2, 3, 4]              # the trained depths
  levels: [[0.01, 0.05], [0.02, 0.05], [0.01, 0.02]]   # A6c's (l, h)
  pairs_per_cell: 34                # 12 cells x 34 = 408 pairs = 816 problems
  max_seeds_per_cell: 136
  seed_offset: 2400000000           # fresh (D147 §5)
  cell_seed_stride: 100000
  n_jobs: 4                         # built with the GPU idle
j_invariance_construction:          # D147 §4: a J world and its dimensionally scaled copy
  version: "1.0.0"
  kind: j_invariance
  candidate_worlds: 96
  min_target_ratio: 2.0             # as A6b
  max_chains: 20
  max_log_sigma_ratio: 1.0e-3       # MC check, as A6b
  scale_factors: [2.0, 0.5, 3.0, 0.3333333333333333, 4.0, 0.25, 6.0, 0.16666666666666666, 8.0, 0.125]   # tried in order
  directions:                       # exponents of (length, mass, time); each leaves every constant of the family unchanged
    kinematics: [[1, 0, 0], [0, 0, 1], [0, 1, 0]]   # no constants
    dynamics: [[2, 0, 1], [0, 1, 0]]                # g = 9.81 m/s^2 fixed: length^2 per time
    energy: [[2, 0, 1], [0, 1, 0]]
  jacobian: *j_jacobian
j_invariance_export:
  families: [kinematics, dynamics, energy]
  depths: [1, 2, 3, 4]
  levels: [0.01, 0.02, 0.05]        # A6b's
  pairs_per_cell: 34
  max_seeds_per_cell: 136
  seed_offset: 2500000000
  cell_seed_stride: 100000
  n_jobs: 4
