# R4-1 (DECISIONS.md D112; pre-registered in D113): D-pos-v2 and its matched implicit control B-v2, 1 seed each.
# Both SFT a fresh LoRA on the pinned 4-bit base with the R4-1 data (configs/sft_r4.yaml: D80's seeds with mixed
# per-given levels), then are evaluated greedily on the frozen A6 / A6b / A6c sets. D-pos's settings
# (configs/stage_d.yaml = configs/stage_b.yaml) everywhere except the data.
sft_phase12_config: sft_r4             # the data's config (prompt v5_two_channel, the data dir and its manifest)
arms:
  dpos2:                               # D-pos-v2: the S lines, the line and sigma trained
    data_arm: explicit
  b2:                                  # B-v2: sigma* written and trained, no line (stage B's arm)
    data_arm: supervised
order: [dpos2, b2]                     # the queue's order (your instruction)
seed: 0
pinned_base: base_4bit                 # D78
lora:                                  # stage B's / D-pos's
  r: 16
  alpha: 16
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
train:                                 # stage B's / D-pos's: configs/sft.yaml's optimizer, 2 epochs
  epochs: 2
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  learning_rate: 1.0e-4
  lr_scheduler_type: constant_with_warmup
  warmup_steps: 10
  weight_decay: 0.0
  max_grad_norm: 1.0
  optim: adamw_8bit
  logging_steps: 10
guards:
  max_gpu_temp_c: 87
  pause_seconds: 600
  check_every_steps: 10
max_reserved_gib: 5.9                  # D115: total 8.0 GiB - steady host use 1.62 GiB (2026-10-25) - 0.5 (D103 was 7.1)
eval:                                  # stage B's eval (stage_b.eval_config)
  frozen_sets_config: eval_frozen_sets
  extra_splits:
    a6c_pairs:
      file: data/eval_sets/2.0.0+bdbb2279/a6c_pairs.jsonl
      verify_regenerate: -1
  prompt: v5_two_channel
  batch_size: 16                       # D116: 32 OOM'd under the 5.9 GiB cap with the 1,280-token budget
  max_reserved_gib: 5.9                # D115, as above
  max_new_tokens: 512                  # D113: the long budget for both arms if the longest D-pos-v2 completion exceeds
  long_completion_tokens: 480          # the limit below
  long_max_new_tokens: 1280            # D114 (deviation from D113's 768): the longest D-pos-v2 training completion is
                                       # 855 tokens, the builder's longest on the eval sets 1,165 (A6c, depth 5)
output_dir: results/stage_r4           # dpos2/seed0/, b2/seed0/ (training + eval), results.json, summary.md
analysis:                              # D113 (physcal.eval.r4_analysis)
  stage_b_config: stage_b              # each arm through stage B's analysis (B1-B5 etc.), one seed; the comparators
  stage_b_root: results/stage_b        # B-v2 - stage B (3-seed mean), descriptive
  stage_d_root: results/stage_d        # D-pos-v2 - D-pos, descriptive
  sensitivity_rel_tol: 0.10            # the lenient sensitivity match (D109's)
  bootstrap: 10000
  seed: 0
  alpha: 0.05                          # Holm over R1-R8
  criterion_ci_level: 0.90             # R4-3: C1's lower bound and C3's TOST interval
  practical_slope: 0.5                 # R4-3: C2
confirmatory:                          # D118: the 3-seed confirmatory run on the frozen R4-5 set (R4-3's go)
  seeds: [0, 1, 2]                     # seed 0 = the existing adapters; 1 and 2 trained with this recipe
  output_subdir: confirmatory          # <arm>/seed<s>/confirmatory/ (rollouts, metrics)
  set_subdir: confirmatory             # data/eval_sets/<generator_version>/confirmatory/ (the analysis's stage-A files)
  x1_predictions: results/x1_text_sigma/confirmatory/predictions.jsonl   # D118 §3: D99's refit (x1_a6c confirmatory)
  x1_reproduction: results/x1_text_sigma/confirmatory/reproduction.json
  analysis_output: results/stage_r4/confirmatory   # results.json, summary.md, stage_b_<arm>/ (D118 §9)
  primary_criteria: [K1, C2, C3]       # D125 (your amendment of D118 §6): D113's full R4-3 criterion on (a)
  splits:                              # replace the development sets; run_eval needs PHYSCAL_CONFIRMATORY=1
    a6_pairs:
      file: data/eval_sets/2.0.0+bdbb2279/confirmatory/a6_pairs.jsonl
      verify_regenerate: -1
    a6b_pairs:
      file: data/eval_sets/2.0.0+bdbb2279/confirmatory/a6b_pairs.jsonl
      verify_regenerate: -1
    a6c_pairs:
      file: data/eval_sets/2.0.0+bdbb2279/confirmatory/a6c_pairs.jsonl
      verify_regenerate: -1
r5_6:                                  # D147 (R5-6 part J): D118's confirmatory eval exactly, on the frozen J files
  seeds: [0, 1, 2]                     # the existing adapters; nothing is trained
  output_subdir: r5_6                  # <arm>/seed<s>/r5_6/ (rollouts, metrics)
  splits:                              # run_eval needs PHYSCAL_CONFIRMATORY=1 (the files are under confirmatory/)
    a6b_pairs:                         # J invariance pairs (dimensional scaling)
      file: data/eval_sets/2.0.0+bdbb2279/confirmatory/r5_6/a6b_pairs.jsonl
      verify_regenerate: -1
    a6c_pairs:                         # J sensitivity pairs (A6c on J worlds)
      file: data/eval_sets/2.0.0+bdbb2279/confirmatory/r5_6/a6c_pairs.jsonl
      verify_regenerate: -1
